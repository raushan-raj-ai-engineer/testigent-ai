openapi: 3.0.3
info:
  title: TestigentAI API Contract Example
  version: 1.0.0
paths:
  /users/{id}:
    get:
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                additionalProperties: false
                properties:
                  id: { type: integer }
                  name: { type: string }

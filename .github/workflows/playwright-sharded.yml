name: TestigentAI Multi-Project CI

on:
  workflow_dispatch:
    inputs:
      app:
        description: Project folder under projects/
        required: true
      environment:
        description: Project environment config
        required: true
      shards:
        description: Core test workers (1 = sequential; >1 = Playwright shards)
        required: false
        type: number
        default: 2
      run_ai:
        description: Run configured AI provider validation
        required: false
        type: boolean
        default: false

  push:
    branches: [main]

  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: testigent-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: ${{ inputs.app || vars.APP }}
  ENV: ${{ inputs.environment || vars.ENV }}

jobs:
  plan:
    name: Execution Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected_core_reports: ${{ steps.plan.outputs.expected_core_reports }}
    steps:
      - name: Build sequential/sharded execution plan
        id: plan
        shell: bash
        env:
          REQUESTED_SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.shards || vars.CI_SHARDS || '2' }}
        run: |
          set -euo pipefail
          SHARDS="${REQUESTED_SHARDS}"
          if ! [[ "${SHARDS}" =~ ^[0-9]+$ ]] || (( SHARDS < 1 || SHARDS > 20 )); then
            echo "::error::CI shard count must be an integer between 1 and 20; received '${SHARDS}'."
            exit 1
          fi
          MATRIX='{"include":['
          for ((i=1; i<=SHARDS; i++)); do
            [[ $i -gt 1 ]] && MATRIX+=','
            MATRIX+="{\"index\":${i},\"total\":${SHARDS}}"
          done
          MATRIX+=']}'
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"
          echo "expected_core_reports=${SHARDS}" >> "${GITHUB_OUTPUT}"
          echo "[plan] core workers=${SHARDS}; mode=$([[ ${SHARDS} -eq 1 ]] && echo sequential || echo sharded)"

  validate:
    name: Framework Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate TestigentAI
        run: npm run validate:final

  test:
    name: Project Tests - Shard ${{ matrix.index }}
    needs: [validate, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'
      CI: 'true'
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # PRs run the governed smoke profile; main pushes run the broader regression profile.
      TEST_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'regression' }}
      # Optional project-owned auth provider inputs. Missing secrets resolve to empty strings.
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      AUTH_REFRESH_TOKEN: ${{ secrets.AUTH_REFRESH_TOKEN }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run non-AI project tests - worker ${{ matrix.index }}/${{ matrix.total }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--project=chromium --grep-invert="@ai")
          if (( ${{ matrix.total }} > 1 )); then
            ARGS+=(--shard=${{ matrix.index }}/${{ matrix.total }})
          fi
          npm run test:project -- "${ARGS[@]}"

      - name: Record core business bundle topology
        if: ${{ always() && !cancelled() }}
        run: npm run ci:report:bundle -- core ${{ matrix.index }} ${{ matrix.total }} true

      - name: Upload technical blob
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ env.APP }}-core-${{ matrix.index }}
          path: reports/${{ env.APP }}/blob-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload business shard
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: business-${{ env.APP }}-core-${{ matrix.index }}
          path: reports/${{ env.APP }}/business
          if-no-files-found: warn
          retention-days: 7

  ai-smoke:
    name: AI Healing Validation
    needs: [validate]
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_ai == true) ||
          (github.event_name == 'push' && vars.AI_CI_ENABLED == 'true')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: 'true'
      APP: ${{ inputs.app || vars.APP }}
      ENV: ${{ inputs.environment || vars.ENV }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      AUTH_REFRESH_TOKEN: ${{ secrets.AUTH_REFRESH_TOKEN }}

      AI_ENABLED: 'true'
      AI_PROVIDER_MODE: ${{ vars.AI_PROVIDER_MODE || 'single' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || '' }}
      AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || '' }}
      AI_ALLOW_CLOUD_EGRESS: ${{ vars.AI_ALLOW_CLOUD_EGRESS || 'false' }}
      AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS || '60000' }}
      AI_TOTAL_TIMEOUT_MS: ${{ vars.AI_TOTAL_TIMEOUT_MS || '90000' }}
      AI_RETRY_MAX_ATTEMPTS: ${{ vars.AI_RETRY_MAX_ATTEMPTS || '3' }}
      AI_RETRY_BASE_DELAY_MS: ${{ vars.AI_RETRY_BASE_DELAY_MS || '1000' }}
      AI_RETRY_MAX_DELAY_MS: ${{ vars.AI_RETRY_MAX_DELAY_MS || '8000' }}
      AI_RETRY_JITTER_MS: ${{ vars.AI_RETRY_JITTER_MS || '250' }}
      AI_RETRY_ON_TIMEOUT: ${{ vars.AI_RETRY_ON_TIMEOUT || 'false' }}
      AI_MAX_CALLS_PER_TEST: ${{ vars.AI_MAX_CALLS_PER_TEST || '2' }}
      AI_PROVIDER_GENERATION_CHECK: ${{ vars.AI_PROVIDER_GENERATION_CHECK || 'true' }}

      TEST_TIMEOUT_MS: ${{ vars.AI_TEST_TIMEOUT_MS || '180000' }}
      NAVIGATION_TIMEOUT_MS: ${{ vars.AI_NAVIGATION_TIMEOUT_MS || '60000' }}
      PW_RETRIES: '0'

      HEALING_AI_ENABLED: 'true'
      HEALING_MODE: runtime
      AI_HEALING_SNAPSHOT_MAX_CHARS: ${{ vars.AI_HEALING_SNAPSHOT_MAX_CHARS || '6000' }}
      AI_AUDIT_ENABLED: 'true'
      AI_RUNTIME_LOGGING: 'true'

      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || '' }}
      GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || 'low' }}
      GEMINI_MAX_OUTPUT_TOKENS: ${{ vars.GEMINI_MAX_OUTPUT_TOKENS || '512' }}

      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || '' }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT || '' }}
      AZURE_OPENAI_MODEL: ${{ vars.AZURE_OPENAI_MODEL || '' }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || '' }}
      AI_COMPAT_BASE_URL: ${{ vars.AI_COMPAT_BASE_URL || '' }}
      AI_COMPAT_MODEL: ${{ vars.AI_COMPAT_MODEL || '' }}
      AI_ENDPOINT: ${{ vars.AI_ENDPOINT || '' }}
      AI_MODEL: ${{ vars.AI_MODEL || '' }}

    outputs:
      has_ai_tests: ${{ steps.detect-ai.outputs.has_ai_tests }}

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Detect AI tests
        id: detect-ai
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "projects/${APP}/tests" ]]; then
            echo "::error::Project test directory not found: projects/${APP}/tests"
            exit 1
          fi

          if grep -RIl \
            --include='*.spec.ts' \
            --include='*.test.ts' \
            '@ai' \
            "projects/${APP}/tests" 2>/dev/null | grep -q .; then
            echo "has_ai_tests=true" >> "$GITHUB_OUTPUT"
            echo "[ai] @ai tests found for project '${APP}'."
          else
            echo "has_ai_tests=false" >> "$GITHUB_OUTPUT"
            echo "[ai] No @ai tests found for project '${APP}'. AI job will finish without provider calls."
          fi

      - name: Validate AI CI configuration
        if: ${{ steps.detect-ai.outputs.has_ai_tests == 'true' }}
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_COMPAT_API_KEY: ${{ secrets.AI_COMPAT_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          set -euo pipefail

          echo "APP=${APP}"
          echo "ENV=${ENV}"
          echo "AI_PROVIDER_MODE=${AI_PROVIDER_MODE}"
          echo "AI_PROVIDER=${AI_PROVIDER}"
          echo "AI_PROVIDER_ORDER=${AI_PROVIDER_ORDER}"
          echo "AI_ALLOW_CLOUD_EGRESS=${AI_ALLOW_CLOUD_EGRESS}"
          echo "AI_TIMEOUT_MS=${AI_TIMEOUT_MS}"
          echo "AI_TOTAL_TIMEOUT_MS=${AI_TOTAL_TIMEOUT_MS}"
          echo "AI_RETRY_MAX_ATTEMPTS=${AI_RETRY_MAX_ATTEMPTS}"
          echo "AI_RETRY_BASE_DELAY_MS=${AI_RETRY_BASE_DELAY_MS}"
          echo "AI_RETRY_MAX_DELAY_MS=${AI_RETRY_MAX_DELAY_MS}"
          echo "AI_RETRY_JITTER_MS=${AI_RETRY_JITTER_MS}"
          echo "AI_RETRY_ON_TIMEOUT=${AI_RETRY_ON_TIMEOUT}"
          echo "TEST_TIMEOUT_MS=${TEST_TIMEOUT_MS}"
          echo "NAVIGATION_TIMEOUT_MS=${NAVIGATION_TIMEOUT_MS}"
          echo "PW_RETRIES=${PW_RETRIES}"
          echo "AI_HEALING_SNAPSHOT_MAX_CHARS=${AI_HEALING_SNAPSHOT_MAX_CHARS}"
          echo "AI_PROVIDER_GENERATION_CHECK=${AI_PROVIDER_GENERATION_CHECK}"
          echo "GEMINI_MODEL=${GEMINI_MODEL}"
          echo "GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL}"
          echo "GEMINI_MAX_OUTPUT_TOKENS=${GEMINI_MAX_OUTPUT_TOKENS}"

          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "${AI_ENABLED}" == "true" ]] || fail "AI_ENABLED must be true in the AI job."
          [[ "${HEALING_AI_ENABLED}" == "true" ]] || fail "HEALING_AI_ENABLED must be true in the AI job."

          [[ "${AI_TIMEOUT_MS}" =~ ^[0-9]+$ ]] || fail "AI_TIMEOUT_MS must be numeric."
          [[ "${AI_TOTAL_TIMEOUT_MS}" =~ ^[0-9]+$ ]] || fail "AI_TOTAL_TIMEOUT_MS must be numeric."
          [[ "${AI_TOTAL_TIMEOUT_MS}" -ge "${AI_TIMEOUT_MS}" ]] || fail "AI_TOTAL_TIMEOUT_MS must be >= AI_TIMEOUT_MS."
          [[ "${AI_RETRY_MAX_ATTEMPTS}" =~ ^[0-9]+$ ]] || fail "AI_RETRY_MAX_ATTEMPTS must be numeric."
          [[ "${AI_RETRY_MAX_ATTEMPTS}" -ge 1 && "${AI_RETRY_MAX_ATTEMPTS}" -le 5 ]] || fail "AI_RETRY_MAX_ATTEMPTS must be between 1 and 5."
          [[ "${AI_RETRY_BASE_DELAY_MS}" =~ ^[0-9]+$ ]] || fail "AI_RETRY_BASE_DELAY_MS must be numeric."
          [[ "${AI_RETRY_MAX_DELAY_MS}" =~ ^[0-9]+$ ]] || fail "AI_RETRY_MAX_DELAY_MS must be numeric."
          [[ "${AI_RETRY_MAX_DELAY_MS}" -ge "${AI_RETRY_BASE_DELAY_MS}" ]] || fail "AI_RETRY_MAX_DELAY_MS must be >= AI_RETRY_BASE_DELAY_MS."
          [[ "${AI_RETRY_JITTER_MS}" =~ ^[0-9]+$ ]] || fail "AI_RETRY_JITTER_MS must be numeric."
          case "${AI_RETRY_ON_TIMEOUT}" in
            true|false) ;;
            *) fail "AI_RETRY_ON_TIMEOUT must be true or false." ;;
          esac
          [[ "${TEST_TIMEOUT_MS}" =~ ^[0-9]+$ ]] || fail "TEST_TIMEOUT_MS must be numeric."
          [[ "${TEST_TIMEOUT_MS}" -gt "${AI_TOTAL_TIMEOUT_MS}" ]] || fail "AI_TEST_TIMEOUT_MS/TEST_TIMEOUT_MS must be greater than AI_TOTAL_TIMEOUT_MS."

          case "${AI_PROVIDER_MODE}" in
            single)
              [[ -n "${AI_PROVIDER}" ]] || fail "AI_PROVIDER is required when AI_PROVIDER_MODE=single. Create GitHub Actions Repository Variable AI_PROVIDER."
              ;;
            failover)
              [[ -n "${AI_PROVIDER_ORDER}" ]] || fail "AI_PROVIDER_ORDER is required when AI_PROVIDER_MODE=failover."
              ;;
            *)
              fail "AI_PROVIDER_MODE must be 'single' or 'failover'."
              ;;
          esac

          if [[ "${AI_PROVIDER_MODE}" == "single" && "${AI_PROVIDER}" == "gemini" ]]; then
            [[ "${AI_ALLOW_CLOUD_EGRESS}" == "true" ]] || fail "Gemini requires AI_ALLOW_CLOUD_EGRESS=true."
            [[ -n "${GEMINI_MODEL}" ]] || fail "GEMINI_MODEL is required for Gemini."
            [[ -n "${GEMINI_API_KEY:-}" ]] || fail "GitHub Actions Repository Secret GEMINI_API_KEY is missing."
            case "${GEMINI_THINKING_LEVEL}" in
              low|medium|high) ;;
              *) fail "GEMINI_THINKING_LEVEL must be low, medium or high." ;;
            esac
            [[ "${GEMINI_MAX_OUTPUT_TOKENS}" =~ ^[0-9]+$ ]] || fail "GEMINI_MAX_OUTPUT_TOKENS must be numeric."
            [[ "${GEMINI_MAX_OUTPUT_TOKENS}" -ge 64 ]] || fail "GEMINI_MAX_OUTPUT_TOKENS must be >= 64."
            echo "Gemini API key configured: YES"
          fi

          echo "AI CI preflight validation: PASSED"

      - name: Check configured AI provider and generation endpoint
        if: ${{ steps.detect-ai.outputs.has_ai_tests == 'true' }}
        run: npm run ai:check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_COMPAT_API_KEY: ${{ secrets.AI_COMPAT_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Run AI healing tests
        if: ${{ steps.detect-ai.outputs.has_ai_tests == 'true' }}
        run: >
          npm run test:project --
          --project=chromium
          --grep="@ai"
        env:
          AI_HEALING_DEMO: ${{ env.APP == 'demo' && 'true' || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_COMPAT_API_KEY: ${{ secrets.AI_COMPAT_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Record AI business bundle topology
        if: ${{ always() && !cancelled() }}
        run: npm run ci:report:bundle -- ai 1 1 "${{ steps.detect-ai.outputs.has_ai_tests || 'unknown' }}"

      - name: Upload AI technical blob
        if: ${{ always() && !cancelled() && steps.detect-ai.outputs.has_ai_tests == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ env.APP }}-ai
          path: reports/${{ env.APP }}/blob-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AI business report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: business-${{ env.APP }}-ai
          path: reports/${{ env.APP }}/business
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AI audit
        if: ${{ always() && !cancelled() && steps.detect-ai.outputs.has_ai_tests == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-audit-${{ env.APP }}
          path: reports/${{ env.APP }}/ai
          if-no-files-found: warn
          retention-days: 7

  merge:
    name: Merge TestigentAI Reports
    needs: [plan, test, ai-smoke]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.test.result != 'skipped'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      actions: write

    env:
      AI_ENABLED: 'false'
      APP: ${{ inputs.app || vars.APP }}
      ENV: ${{ inputs.environment || vars.ENV }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore business report history
        uses: actions/cache@v4
        with:
          path: .report-history/${{ env.APP }}
          key: testigent-report-history-${{ env.APP }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            testigent-report-history-${{ env.APP }}-

      - name: Download all technical blobs
        uses: actions/download-artifact@v8
        with:
          pattern: blob-${{ env.APP }}-*
          path: all-blob-reports
          merge-multiple: true

      - name: Download all business reports
        uses: actions/download-artifact@v8
        with:
          pattern: business-${{ env.APP }}-*
          path: all-business-reports

      - name: Download AI audit
        if: ${{ needs.ai-smoke.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: ai-audit-${{ env.APP }}
          path: reports/${{ env.APP }}/ai
          merge-multiple: true

      - name: Merge Playwright technical report
        run: npm run report:merge:technical

      - name: Merge business reports
        run: npm run report:merge:business -- all-business-reports
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_CORE_REPORTS: ${{ needs.plan.outputs.expected_core_reports }}
          EXPECT_AI_LANE: ${{ needs.ai-smoke.result != 'skipped' && 'true' || 'false' }}

      - name: Finalize business execution facts
        run: npm run ci:business:finalize

      - name: Generate TestigentAI business dashboard
        run: npm run report:business
        env:
          AI_ENABLED: 'false'

      - name: Validate final business bundle
        run: npm run ci:business:validate

      - name: Publish merged report summary
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: npm run --silent ci:business:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final TestigentAI report
        id: final-upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: testigent-ai-report-${{ env.APP }}-${{ github.run_id }}
          path: reports/${{ env.APP }}
          if-no-files-found: warn
          retention-days: 14

      - name: Optional stakeholder email
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            vars.BUSINESS_EMAIL_ENABLED == 'true'
          }}
        continue-on-error: true
        run: npm run ci:mail
        env:
          BUSINESS_EMAIL_ENABLED: 'true'
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Remove intermediate CI artifacts
        if: >-
          ${{
            always() &&
            !cancelled() &&
            steps.final-upload.outcome == 'success' &&
            github.event_name != 'pull_request'
          }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_ids="$({
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(
                (.name | startswith("blob-")) or
                (.name | startswith("business-")) or
                (.name | startswith("ai-audit-"))
              ) | .id'
          } || true)"

          if [[ -z "${artifact_ids}" ]]; then
            echo "No intermediate artifacts to remove."
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [[ -z "${artifact_id}" ]] && continue
            echo "Removing intermediate artifact ${artifact_id}"
            gh api \
              --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<< "${artifact_ids}"

name: TestigentAI Multi-Project CI

on:
  workflow_dispatch:
    inputs:
      app:
        description: Project folder under projects/
        required: true
      environment:
        description: Project environment config
        required: true
      shards:
        description: Core test workers (1 = sequential; >1 = Playwright shards)
        required: false
        type: number
        default: 2
      run_ai:
        description: Run configured AI provider validation
        required: false
        type: boolean
        default: false

  push:
    branches: [main]

  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: testigent-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: ${{ inputs.app || vars.APP }}
  ENV: ${{ inputs.environment || vars.ENV }}

jobs:
  plan:
    name: Execution Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected_core_reports: ${{ steps.plan.outputs.expected_core_reports }}
    steps:
      - name: Build sequential/sharded execution plan
        id: plan
        shell: bash
        env:
          REQUESTED_SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.shards || vars.CI_SHARDS || '2' }}
        run: |
          set -euo pipefail
          SHARDS="${REQUESTED_SHARDS}"
          if ! [[ "${SHARDS}" =~ ^[0-9]+$ ]] || (( SHARDS < 1 || SHARDS > 20 )); then
            echo "::error::CI shard count must be an integer between 1 and 20; received '${SHARDS}'."
            exit 1
          fi
          MATRIX='{"include":['
          for ((i=1; i<=SHARDS; i++)); do
            [[ $i -gt 1 ]] && MATRIX+=','
            MATRIX+="{\"index\":${i},\"total\":${SHARDS}}"
          done
          MATRIX+=']}'
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"
          echo "expected_core_reports=${SHARDS}" >> "${GITHUB_OUTPUT}"
          echo "[plan] core workers=${SHARDS}; mode=$([[ ${SHARDS} -eq 1 ]] && echo sequential || echo sharded)"

  validate:
    name: Framework Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove browser-free API/data/DB fixture lane
        run: npm run test:review:browser-free

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate TestigentAI
        run: npm run validate:final

  test:
    name: Project Tests - Shard ${{ matrix.index }}
    needs: [validate, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'
      CI: 'true'
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # PRs run the governed smoke profile; main pushes run the broader regression profile.
      TEST_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'regression' }}
      # Optional project-owned auth provider inputs. Missing secrets resolve to empty strings.
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      AUTH_REFRESH_TOKEN: ${{ secrets.AUTH_REFRESH_TOKEN }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run non-AI project tests - worker ${{ matrix.index }}/${{ matrix.total }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--project=chromium --grep-invert="@ai" --pass-with-no-tests)
          if (( ${{ matrix.total }} > 1 )); then
            ARGS+=(--shard=${{ matrix.index }}/${{ matrix.total }})
          fi
          npm run test:project -- "${ARGS[@]}"

      - name: Record core business bundle topology
        if: ${{ always() && !cancelled() }}
        run: npm run ci:report:bundle -- core ${{ matrix.index }} ${{ matrix.total }} auto

      - name: Upload technical blob
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-${{ env.APP }}-${{ env.RUN_ID }}-core-${{ matrix.index }}
          path: reports/${{ env.APP }}/${{ env.ENV }}/${{ env.RUN_ID }}/blob-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload business shard
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: business-${{ env.APP }}-${{ env.RUN_ID }}-core-${{ matrix.index }}
          path: reports/${{ env.APP }}/${{ env.ENV }}/${{ env.RUN_ID }}/business
          if-no-files-found: error
          retention-days: 7

  ai-contracts:
    name: AI Deterministic Safety
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'
    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic AI safety contracts
        run: npm run test:ai:deterministic

  agentic-contracts:
    name: Agentic Deterministic Safety
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'
    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic agentic safety contracts
        run: npm run test:agentic:deterministic

  product-intelligence-contracts:
    name: Product Intelligence Deterministic Safety
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'
    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run adoption, benchmark and API contract safety contracts
        run: npm run test:product-intelligence

  failure-intelligence-contracts:
    name: Failure Intelligence Deterministic Safety
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'
    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run failure intelligence, showcase isolation and reporting-freeze contracts
        run: npm run test:failure-intelligence

  ai-canary:
    name: AI Live Provider Canary (non-blocking)
    needs: [validate]
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_ai == true) ||
          (github.event_name == 'push' && vars.AI_CI_ENABLED == 'true')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: 'true'
      APP: ${{ inputs.app || vars.APP }}
      ENV: ${{ inputs.environment || vars.ENV }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      AUTH_REFRESH_TOKEN: ${{ secrets.AUTH_REFRESH_TOKEN }}

      AI_ENABLED: 'true'
      ALLOW_AI_TESTS: 'true'
      AI_PROVIDER_MODE: ${{ vars.AI_PROVIDER_MODE || 'single' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || '' }}
      AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || '' }}
      AI_ALLOW_CLOUD_EGRESS: ${{ vars.AI_ALLOW_CLOUD_EGRESS || 'false' }}
      AI_ALLOWED_PRIVATE_ORIGINS: ${{ vars.AI_ALLOWED_PRIVATE_ORIGINS || '' }}
      AI_ALLOWED_EXTERNAL_ORIGINS: ${{ vars.AI_ALLOWED_EXTERNAL_ORIGINS || '' }}
      AI_ALLOW_CROSS_ORIGIN_REDIRECTS: 'false'
      AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS || '30000' }}
      AI_TOTAL_TIMEOUT_MS: ${{ vars.AI_TOTAL_TIMEOUT_MS || '90000' }}
      AI_RETRY_MAX_ATTEMPTS: ${{ vars.AI_RETRY_MAX_ATTEMPTS || '3' }}
      AI_RETRY_BASE_DELAY_MS: ${{ vars.AI_RETRY_BASE_DELAY_MS || '1000' }}
      AI_RETRY_MAX_DELAY_MS: ${{ vars.AI_RETRY_MAX_DELAY_MS || '8000' }}
      AI_RETRY_JITTER_MS: ${{ vars.AI_RETRY_JITTER_MS || '250' }}
      AI_RETRY_ON_TIMEOUT: ${{ vars.AI_RETRY_ON_TIMEOUT || 'true' }}
      AI_MAX_CALLS_PER_TEST: ${{ vars.AI_MAX_CALLS_PER_TEST || '2' }}
      AI_PROVIDER_GENERATION_CHECK: ${{ vars.AI_PROVIDER_GENERATION_CHECK || 'true' }}

      TEST_TIMEOUT_MS: ${{ vars.AI_TEST_TIMEOUT_MS || '180000' }}
      NAVIGATION_TIMEOUT_MS: ${{ vars.AI_NAVIGATION_TIMEOUT_MS || '60000' }}
      PW_RETRIES: '0'

      HEALING_AI_ENABLED: 'true'
      HEALING_MODE: runtime
      AI_HEALING_SNAPSHOT_MAX_CHARS: ${{ vars.AI_HEALING_SNAPSHOT_MAX_CHARS || '6000' }}
      AI_AUDIT_ENABLED: 'true'
      AI_RUNTIME_LOGGING: 'true'

      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || '' }}
      GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || 'low' }}
      GEMINI_MAX_OUTPUT_TOKENS: ${{ vars.GEMINI_MAX_OUTPUT_TOKENS || '512' }}

      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || '' }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT || '' }}
      AZURE_OPENAI_MODEL: ${{ vars.AZURE_OPENAI_MODEL || '' }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || '' }}
      AI_COMPAT_BASE_URL: ${{ vars.AI_COMPAT_BASE_URL || '' }}
      AI_COMPAT_MODEL: ${{ vars.AI_COMPAT_MODEL || '' }}
      AI_ENDPOINT: ${{ vars.AI_ENDPOINT || '' }}
      AI_MODEL: ${{ vars.AI_MODEL || '' }}

    outputs:
      has_ai_tests: ${{ steps.detect-ai.outputs.has_ai_tests }}
      canary_healthy: ${{ steps.classify-canary.outputs.canary_healthy }}
      canary_status: ${{ steps.classify-canary.outputs.canary_status }}

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Initialize AI canary runtime paths
        shell: bash
        run: |
          set -euo pipefail
          canary_path="reports/${APP}/${ENV}/${RUN_ID}/provider-canary/ai-provider-canary.json"
          echo "AI_CANARY_RECORD_FILE=${canary_path}" >> "$GITHUB_ENV"
          echo "AI_PROVIDER_HEALTH_FILE=${canary_path}" >> "$GITHUB_ENV"

      - name: Detect AI tests
        id: detect-ai
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "projects/${APP}/tests" ]]; then
            echo "::error::Project test directory not found: projects/${APP}/tests"
            exit 1
          fi

          if grep -RIl \
            --include='*.spec.ts' \
            --include='*.test.ts' \
            '@ai' \
            "projects/${APP}/tests" 2>/dev/null | grep -q .; then
            echo "has_ai_tests=true" >> "$GITHUB_OUTPUT"
            echo "[ai] @ai tests found for project '${APP}'."
          else
            echo "has_ai_tests=false" >> "$GITHUB_OUTPUT"
            echo "[ai] No @ai tests found for project '${APP}'. AI job will finish without provider calls."
          fi

      - name: Validate AI CI configuration
        id: validate-ai-config
        if: ${{ steps.detect-ai.outputs.has_ai_tests == 'true' }}
        continue-on-error: true
        run: npm run ai:canary:preflight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_COMPAT_API_KEY: ${{ secrets.AI_COMPAT_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Check configured AI provider and generation endpoint
        id: provider-check
        if: ${{ steps.detect-ai.outputs.has_ai_tests == 'true' && steps.validate-ai-config.outcome == 'success' }}
        continue-on-error: true
        run: npm run ai:check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_COMPAT_API_KEY: ${{ secrets.AI_COMPAT_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Run AI healing tests
        id: healing-check
        if: ${{ steps.detect-ai.outputs.has_ai_tests == 'true' && steps.validate-ai-config.outcome == 'success' && steps.provider-check.outcome == 'success' }}
        continue-on-error: true
        run: >
          npm run test:project --
          --project=chromium
          --grep="@ai"
        env:
          AI_HEALING_DEMO: ${{ env.APP == 'demo' && 'true' || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_COMPAT_API_KEY: ${{ secrets.AI_COMPAT_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Classify live AI provider canary
        id: classify-canary
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          AI_CANARY_HAS_TESTS: ${{ steps.detect-ai.outputs.has_ai_tests || 'false' }}
          AI_CANARY_CONFIG_OUTCOME: ${{ steps.validate-ai-config.outcome || 'skipped' }}
          AI_CANARY_PROVIDER_OUTCOME: ${{ steps.provider-check.outcome || 'skipped' }}
          AI_CANARY_HEALING_OUTCOME: ${{ steps.healing-check.outcome || 'skipped' }}
        run: |
          set -euo pipefail
          npm run ai:canary:finalize
          status="$(node -e "const fs=require('fs');const p=process.env.AI_CANARY_RECORD_FILE;process.stdout.write(JSON.parse(fs.readFileSync(p,'utf8')).status)")"
          echo "canary_status=${status}" >> "$GITHUB_OUTPUT"
          if [[ "${status}" == "HEALTHY" ]]; then
            echo "canary_healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "canary_healthy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Live AI provider canary=${status}. This job is operational/non-blocking; deterministic AI safety remains blocking."
          fi
          {
            echo "## Live AI provider canary"
            echo "- Status: **${status}**"
            echo "- Blocking release correctness: **No**"
            echo "- Blocking deterministic AI safety: **AI Deterministic Safety job**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live AI provider canary
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-canary-${{ env.APP }}-${{ env.RUN_ID }}
          path: reports/${{ env.APP }}/${{ env.ENV }}/${{ env.RUN_ID }}/provider-canary/ai-provider-canary.json
          if-no-files-found: error
          retention-days: 14

      - name: Record AI business bundle topology
        if: ${{ always() && !cancelled() && steps.classify-canary.outputs.canary_healthy == 'true' }}
        run: npm run ci:report:bundle -- ai 1 1 "${{ steps.detect-ai.outputs.has_ai_tests || 'unknown' }}"

      - name: Upload AI technical blob
        if: ${{ always() && !cancelled() && steps.classify-canary.outputs.canary_healthy == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-${{ env.APP }}-${{ env.RUN_ID }}-ai
          path: reports/${{ env.APP }}/${{ env.ENV }}/${{ env.RUN_ID }}/blob-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AI business report
        if: ${{ always() && !cancelled() && steps.classify-canary.outputs.canary_healthy == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: business-${{ env.APP }}-${{ env.RUN_ID }}-ai
          path: reports/${{ env.APP }}/${{ env.ENV }}/${{ env.RUN_ID }}/business
          if-no-files-found: error
          retention-days: 7

      - name: Upload AI audit
        if: ${{ always() && !cancelled() && steps.classify-canary.outputs.canary_healthy == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-audit-${{ env.APP }}-${{ env.RUN_ID }}
          path: reports/${{ env.APP }}/${{ env.ENV }}/${{ env.RUN_ID }}/ai
          if-no-files-found: warn
          retention-days: 7

  merge:
    name: Merge TestigentAI Reports
    needs: [plan, test, ai-contracts, agentic-contracts, product-intelligence-contracts, failure-intelligence-contracts, ai-canary]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.test.result != 'skipped'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      actions: write

    env:
      AI_ENABLED: 'false'
      APP: ${{ inputs.app || vars.APP }}
      ENV: ${{ inputs.environment || vars.ENV }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore business report history
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .report-history/${{ env.APP }}
          key: testigent-report-history-${{ env.APP }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            testigent-report-history-${{ env.APP }}-

      - name: Download workflow-run AI provider canaries
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: ai-canary-${{ env.APP }}-${{ github.run_id }}-*
          path: ai-canary-records
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Record AI provider health history
        id: provider-health
        run: npm run ci:ai:health -- ai-canary-records
        env:
          AI_CANARY_EXPECTED: ${{ needs.ai-canary.result != 'skipped' && 'true' || 'false' }}
          CI_WORKFLOW_RUN_ID: ${{ github.run_id }}
          CI_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}

      # Supplying github-token + run-id forces the public artifacts API path.
      # That is required for partial reruns because the default current-attempt
      # backend view does not expose sibling/prior-attempt artifacts reliably.
      - name: Download workflow-run technical blobs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: blob-${{ env.APP }}-${{ github.run_id }}-*-*
          path: all-blob-reports-raw
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download workflow-run business reports
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: business-${{ env.APP }}-${{ github.run_id }}-*-*
          path: all-business-reports-raw
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Resolve rerun-safe report provenance
        run: npm run ci:report:rerun:resolve -- all-business-reports-raw all-business-reports all-blob-reports-raw all-blob-reports
        env:
          EXPECTED_CORE_WORKERS: ${{ needs.plan.outputs.expected_core_reports }}
          EXPECT_AI_LANE: ${{ steps.provider-health.outputs.canary_healthy == 'true' && 'true' || 'false' }}
          CI_WORKFLOW_RUN_ID: ${{ github.run_id }}
          CI_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}

      - name: Download AI audit
        if: ${{ steps.provider-health.outputs.canary_healthy == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: ai-audit-${{ env.APP }}-${{ env.RUN_ID }}
          path: reports/${{ env.APP }}/${{ env.ENV }}/${{ env.RUN_ID }}/ai
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Validate downloaded report bundles
        run: npm run ci:report:download:validate -- all-business-reports
        env:
          EXPECTED_CORE_WORKERS: ${{ needs.plan.outputs.expected_core_reports }}
          EXPECT_AI_LANE: ${{ steps.provider-health.outputs.canary_healthy == 'true' && 'true' || 'false' }}
          CI_ALLOW_SAME_WORKFLOW_PRIOR_ATTEMPTS: 'true'
          CI_WORKFLOW_RUN_ID: ${{ github.run_id }}
          CI_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}

      - name: Merge Playwright technical report
        run: npm run report:merge:technical

      - name: Merge business reports
        id: merge-business
        run: npm run report:merge:business -- all-business-reports
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_CORE_WORKERS: ${{ needs.plan.outputs.expected_core_reports }}
          EXPECT_AI_LANE: ${{ steps.provider-health.outputs.canary_healthy == 'true' && 'true' || 'false' }}
          CI_ALLOW_SAME_WORKFLOW_PRIOR_ATTEMPTS: 'true'
          CI_WORKFLOW_RUN_ID: ${{ github.run_id }}
          CI_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}

      - name: Finalize business execution facts
        run: npm run ci:business:finalize

      - name: Generate TestigentAI business dashboard
        run: npm run report:business
        env:
          AI_ENABLED: 'false'

      - name: Validate final business bundle
        id: validate-final-business
        run: npm run ci:business:validate

      - name: Publish merged report summary
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: npm run --silent ci:business:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final TestigentAI report
        id: final-upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testigent-ai-report-${{ env.APP }}-${{ env.RUN_ID }}
          path: reports/${{ env.APP }}/${{ env.ENV }}/${{ env.RUN_ID }}
          if-no-files-found: warn
          retention-days: 14

      - name: Optional stakeholder email
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            vars.BUSINESS_EMAIL_ENABLED == 'true'
          }}
        continue-on-error: true
        run: npm run ci:mail
        env:
          BUSINESS_EMAIL_ENABLED: 'true'
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Remove intermediate CI artifacts
        if: >-
          ${{
            always() &&
            !cancelled() &&
            steps.merge-business.outcome == 'success' &&
            steps.validate-final-business.outcome == 'success' &&
            steps.final-upload.outcome == 'success' &&
            needs.test.result == 'success' &&
            needs.ai-contracts.result == 'success' &&
            needs.agentic-contracts.result == 'success' &&
            needs.product-intelligence-contracts.result == 'success' &&
            needs.failure-intelligence-contracts.result == 'success' &&
            github.event_name != 'pull_request'
          }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_ids="$({
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(
                (.name | startswith(\"blob-${APP}-${GITHUB_RUN_ID}-\")) or
                (.name | startswith(\"business-${APP}-${GITHUB_RUN_ID}-\")) or
                (.name | startswith(\"ai-audit-${APP}-${GITHUB_RUN_ID}-\")) or
                (.name | startswith(\"ai-canary-${APP}-${GITHUB_RUN_ID}-\"))
              ) | .id"
          } || true)"

          if [[ -z "${artifact_ids}" ]]; then
            echo "No intermediate artifacts to remove."
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [[ -z "${artifact_id}" ]] && continue
            echo "Removing intermediate artifact ${artifact_id}"
            gh api \
              --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<< "${artifact_ids}"

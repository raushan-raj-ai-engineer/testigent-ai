name: TestigentAI Multi-Project CI

on:
  workflow_dispatch:
    inputs:
      app:
        description: Project folder under projects/
        required: true
        type: string

      environment:
        description: Project environment config
        required: true
        type: string

      run_ai:
        description: Run configured AI provider validation
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  actions: read

concurrency:
  group: testigent-ai-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # workflow_dispatch inputs take precedence.
  # Normal push/PR runs use GitHub Repository Variables APP and ENV.
  APP: ${{ github.event_name == 'workflow_dispatch' && inputs.app || vars.APP }}
  ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.ENV }}

jobs:

  # ---------------------------------------------------------------------------
  # 1. FRAMEWORK VALIDATION
  # ---------------------------------------------------------------------------

  validate:
    name: Framework Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: 'true'
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@v7

      - name: Validate CI target configuration
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ -n "${APP:-}" ]] || fail \
            "Repository Variable APP is missing. Configure Settings > Secrets and variables > Actions > Variables."

          [[ -n "${ENV:-}" ]] || fail \
            "Repository Variable ENV is missing. Configure Settings > Secrets and variables > Actions > Variables."

          [[ -d "projects/${APP}" ]] || fail \
            "Configured project does not exist: projects/${APP}"

          [[ -f "projects/${APP}/project.json" ]] || fail \
            "Missing project configuration: projects/${APP}/project.json"

          [[ -f "projects/${APP}/config/${ENV}.json" ]] || fail \
            "Missing environment configuration: projects/${APP}/config/${ENV}.json"

          echo "TestigentAI CI target"
          echo "APP=${APP}"
          echo "ENV=${ENV}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # CI must never run interactive qa:auth.
      # Authentication state is restored from repository secrets.
      - name: Restore authentication state
        shell: bash
        env:
          PW_STORAGE_STATE_B64: ${{ secrets.PW_STORAGE_STATE_B64 }}
          PW_SESSION_STORAGE_B64: ${{ secrets.PW_SESSION_STORAGE_B64 }}
        run: |
          set -euo pipefail

          mkdir -p .auth

          STORAGE_PATH=".auth/${APP}.exploration.json"
          SESSION_PATH="${STORAGE_PATH}.session.json"

          if [[ -n "${PW_STORAGE_STATE_B64:-}" ]]; then
            printf '%s' "${PW_STORAGE_STATE_B64}" \
              | base64 --decode > "${STORAGE_PATH}"

            chmod 600 "${STORAGE_PATH}"

            echo "[auth] Playwright storage state restored."
          else
            echo "[auth] PW_STORAGE_STATE_B64 is not configured."
          fi

          if [[ -n "${PW_SESSION_STORAGE_B64:-}" ]]; then
            printf '%s' "${PW_SESSION_STORAGE_B64}" \
              | base64 --decode > "${SESSION_PATH}"

            chmod 600 "${SESSION_PATH}"

            echo "[auth] sessionStorage companion restored."
          else
            echo "[auth] No sessionStorage companion configured."
          fi

      - name: TestigentAI doctor
        run: npm run qa:doctor

      - name: Validate TestigentAI
        run: npm run validate:final


  # ---------------------------------------------------------------------------
  # 2. NORMAL PROJECT TEST SHARDS
  # ---------------------------------------------------------------------------

  test:
    name: Project Tests - Shard ${{ matrix.index }}
    needs:
      - validate

    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CI: 'true'

      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'

      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # PR:
      #   governed PR profile
      #
      # main:
      #   broader regression profile
      TEST_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'regression' }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - shard: '1/2'
            index: 1

          - shard: '2/2'
            index: 2

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore authentication state
        shell: bash
        env:
          PW_STORAGE_STATE_B64: ${{ secrets.PW_STORAGE_STATE_B64 }}
          PW_SESSION_STORAGE_B64: ${{ secrets.PW_SESSION_STORAGE_B64 }}
        run: |
          set -euo pipefail

          mkdir -p .auth

          STORAGE_PATH=".auth/${APP}.exploration.json"
          SESSION_PATH="${STORAGE_PATH}.session.json"

          if [[ -n "${PW_STORAGE_STATE_B64:-}" ]]; then
            printf '%s' "${PW_STORAGE_STATE_B64}" \
              | base64 --decode > "${STORAGE_PATH}"

            chmod 600 "${STORAGE_PATH}"
          fi

          if [[ -n "${PW_SESSION_STORAGE_B64:-}" ]]; then
            printf '%s' "${PW_SESSION_STORAGE_B64}" \
              | base64 --decode > "${SESSION_PATH}"

            chmod 600 "${SESSION_PATH}"
          fi

      - name: Verify project readiness
        run: npm run qa:doctor

      - name: Run non-AI project tests - shard ${{ matrix.index }}
        run: >
          npm run test:project --
          --project=chromium
          --shard=${{ matrix.shard }}
          --grep-invert="@ai"

      - name: Upload technical blob
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ env.APP }}-${{ matrix.index }}
          path: reports/${{ env.APP }}/blob-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload business shard
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: business-${{ env.APP }}-${{ matrix.index }}
          path: reports/${{ env.APP }}/business
          if-no-files-found: warn
          retention-days: 7


  # ---------------------------------------------------------------------------
  # 3. DEDICATED AI / HEALING VALIDATION
  #
  # AI is intentionally not executed for pull_request because:
  #
  # - cloud/provider secrets should not be required for normal PR validation
  # - PR test shards already exclude @ai
  # - AI execution is owned by this dedicated lane
  # ---------------------------------------------------------------------------

  ai-smoke:
    name: AI Healing Validation

    needs:
      - validate

    if: >-
      ${{
        github.event_name != 'pull_request' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_ai == true) ||
          (github.event_name == 'push' && vars.AI_CI_ENABLED == 'true')
        )
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: 'true'

      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      AI_ENABLED: 'true'
      HEALING_AI_ENABLED: 'true'
      HEALING_MODE: runtime

      AI_PROVIDER_MODE: ${{ vars.AI_PROVIDER_MODE || 'single' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || '' }}
      AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || '' }}

      AI_ALLOW_CLOUD_EGRESS: ${{ vars.AI_ALLOW_CLOUD_EGRESS || 'false' }}

      AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS || '60000' }}
      AI_TOTAL_TIMEOUT_MS: ${{ vars.AI_TOTAL_TIMEOUT_MS || '90000' }}

      AI_RETRY_MAX_ATTEMPTS: ${{ vars.AI_RETRY_MAX_ATTEMPTS || '3' }}
      AI_RETRY_BASE_DELAY_MS: ${{ vars.AI_RETRY_BASE_DELAY_MS || '1000' }}
      AI_RETRY_MAX_DELAY_MS: ${{ vars.AI_RETRY_MAX_DELAY_MS || '8000' }}
      AI_RETRY_JITTER_MS: ${{ vars.AI_RETRY_JITTER_MS || '250' }}
      AI_RETRY_ON_TIMEOUT: ${{ vars.AI_RETRY_ON_TIMEOUT || 'false' }}

      AI_MAX_CALLS_PER_TEST: ${{ vars.AI_MAX_CALLS_PER_TEST || '2' }}
      AI_PROVIDER_GENERATION_CHECK: ${{ vars.AI_PROVIDER_GENERATION_CHECK || 'true' }}

      TEST_TIMEOUT_MS: ${{ vars.AI_TEST_TIMEOUT_MS || '180000' }}
      NAVIGATION_TIMEOUT_MS: ${{ vars.AI_NAVIGATION_TIMEOUT_MS || '60000' }}

      PW_RETRIES: '0'

      AI_HEALING_SNAPSHOT_MAX_CHARS: ${{ vars.AI_HEALING_SNAPSHOT_MAX_CHARS || '6000' }}

      AI_AUDIT_ENABLED: 'true'
      AI_RUNTIME_LOGGING: 'true'

      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || '' }}
      GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || 'low' }}
      GEMINI_MAX_OUTPUT_TOKENS: ${{ vars.GEMINI_MAX_OUTPUT_TOKENS || '512' }}

      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || '' }}

      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT || '' }}
      AZURE_OPENAI_MODEL: ${{ vars.AZURE_OPENAI_MODEL || '' }}

      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || '' }}

      AI_COMPAT_BASE_URL: ${{ vars.AI_COMPAT_BASE_URL || '' }}
      AI_COMPAT_MODEL: ${{ vars.AI_COMPAT_MODEL || '' }}

      AI_ENDPOINT: ${{ vars.AI_ENDPOINT || '' }}
      AI_MODEL: ${{ vars.AI_MODEL || '' }}

    outputs:
      has_ai_tests: ${{ steps.detect-ai.outputs.has_ai_tests }}

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore authentication state
        shell: bash
        env:
          PW_STORAGE_STATE_B64: ${{ secrets.PW_STORAGE_STATE_B64 }}
          PW_SESSION_STORAGE_B64: ${{ secrets.PW_SESSION_STORAGE_B64 }}
        run: |
          set -euo pipefail

          mkdir -p .auth

          STORAGE_PATH=".auth/${APP}.exploration.json"
          SESSION_PATH="${STORAGE_PATH}.session.json"

          if [[ -n "${PW_STORAGE_STATE_B64:-}" ]]; then
            printf '%s' "${PW_STORAGE_STATE_B64}" \
              | base64 --decode > "${STORAGE_PATH}"

            chmod 600 "${STORAGE_PATH}"
          fi

          if [[ -n "${PW_SESSION_STORAGE_B64:-}" ]]; then
            printf '%s' "${PW_SESSION_STORAGE_B64}" \
              | base64 --decode > "${SESSION_PATH}"

            chmod 600 "${SESSION_PATH}"
          fi

      - name: Detect AI tests
        id: detect-ai
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "projects/${APP}/tests" ]]; then
            echo "::error::Project test directory not found: projects/${APP}/tests"
            exit 1
          fi

          if grep -RIl \
            --include='*.spec.ts' \
            --include='*.test.ts' \
            '@ai' \
            "projects/${APP}/tests" 2>/dev/null | grep -q .; then

            echo "has_ai_tests=true" >> "${GITHUB_OUTPUT}"
            echo "[ai] @ai tests found for project '${APP}'."

          else

            echo "has_ai_tests=false" >> "${GITHUB_OUTPUT}"
            echo "[ai] No @ai tests found for project '${APP}'."

          fi

      - name: Validate project readiness
        if: ${{ steps.detect-ai.outputs.has_ai_tests == 'true' }}
        run: npm run qa:doctor

      - name: Check configured AI provider
        if: ${{ steps.detect-ai.outputs.has_ai_tests == 'true' }}
        run: npm run ai:check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_COMPAT_API_KEY: ${{ secrets.AI_COMPAT_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Run AI healing tests
        if: ${{ steps.detect-ai.outputs.has_ai_tests == 'true' }}
        run: >
          npm run test:project --
          --project=chromium
          --grep="@ai"

        env:
          AI_HEALING_DEMO: ${{ env.APP == 'demo' && 'true' || 'false' }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_COMPAT_API_KEY: ${{ secrets.AI_COMPAT_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Upload AI technical blob
        if: ${{ always() && !cancelled() && steps.detect-ai.outputs.has_ai_tests == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ env.APP }}-ai
          path: reports/${{ env.APP }}/blob-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AI business report
        if: ${{ always() && !cancelled() && steps.detect-ai.outputs.has_ai_tests == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: business-${{ env.APP }}-ai
          path: reports/${{ env.APP }}/business
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AI audit
        if: ${{ always() && !cancelled() && steps.detect-ai.outputs.has_ai_tests == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-audit-${{ env.APP }}
          path: reports/${{ env.APP }}/ai
          if-no-files-found: warn
          retention-days: 7


  # ---------------------------------------------------------------------------
  # 4. FINAL MERGED REPORT
  # ---------------------------------------------------------------------------

  merge:
    name: Merge TestigentAI Reports

    needs:
      - test
      - ai-smoke

    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.test.result != 'skipped'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      actions: write

    env:
      CI: 'true'
      AI_ENABLED: 'false'
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout TestigentAI
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore business report history
        uses: actions/cache@v4
        with:
          path: .report-history/${{ env.APP }}
          key: testigent-report-history-${{ env.APP }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            testigent-report-history-${{ env.APP }}-

      - name: Download all technical blobs
        uses: actions/download-artifact@v8
        with:
          pattern: blob-${{ env.APP }}-*
          path: all-blob-reports
          merge-multiple: true

      - name: Download all business reports
        uses: actions/download-artifact@v8
        with:
          pattern: business-${{ env.APP }}-*
          path: all-business-reports

      - name: Download AI audit
        if: ${{ needs.ai-smoke.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: ai-audit-${{ env.APP }}
          path: reports/${{ env.APP }}/ai
          merge-multiple: true

      - name: Merge Playwright technical report
        run: npm run report:merge:technical

      - name: Merge business reports
        run: npm run report:merge:business -- all-business-reports
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Finalize business execution facts
        run: npm run ci:business:finalize

      - name: Generate TestigentAI business dashboard
        run: npm run report:business
        env:
          AI_ENABLED: 'false'

      - name: Validate final business bundle
        run: npm run ci:business:validate

      - name: Publish merged report summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FILE="reports/${APP}/business/business-report.json"

          if [[ ! -f "${REPORT_FILE}" ]]; then
            echo "Merged business report was not generated." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          node - <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('fs');

          const app = process.env.APP;
          const path = `reports/${app}/business/business-report.json`;

          const f = JSON.parse(
            fs.readFileSync(path, 'utf8')
          );

          console.log('## TestigentAI merged quality report');
          console.log('');
          console.log(`- Selected: **${f.total}**`);
          console.log(`- Applicable: **${f.executionEligible}**`);
          console.log(
            `- Executed: **${f.executed}/${f.executionEligible} (${f.executionRate}%)**`
          );
          console.log(`- Not applicable: **${f.notApplicable ?? 0}**`);
          console.log(`- Blocked: **${f.blocked ?? 0}**`);
          console.log(
            `- Quality failed: **${f.qualityFailed}** ` +
            `(known ${f.knownDefects}, unexpected ${f.unexpectedFailed})`
          );
          console.log(
            `- CI-blocking issues: **${f.ciBlockingIssues}**`
          );
          console.log(
            `- Self-healed: **${f.healing?.count ?? 0}**`
          );
          console.log(
            `- AI calls: **${f.aiUsage?.calls ?? 0}**`
          );
          console.log(
            `- Aggregated report bundles: **${f.aggregation?.sourceReports ?? 1}**`
          );
          NODE

      - name: Upload final TestigentAI report
        id: final-upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: testigent-ai-report-${{ env.APP }}-${{ github.run_id }}
          path: reports/${{ env.APP }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish report artifact link
        if: ${{ always() && steps.final-upload.outputs.artifact-url != '' }}
        shell: bash
        run: |
          {
            echo ""
            echo "### Final TestigentAI report"
            echo ""
            echo "[Download merged report artifact](${{ steps.final-upload.outputs.artifact-url }})"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Optional stakeholder email
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            vars.BUSINESS_EMAIL_ENABLED == 'true'
          }}

        continue-on-error: true

        run: npm run ci:mail

        env:
          BUSINESS_EMAIL_ENABLED: 'true'

          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Remove intermediate CI artifacts
        if: >-
          ${{
            always() &&
            !cancelled() &&
            steps.final-upload.outcome == 'success' &&
            github.event_name != 'pull_request'
          }}

        continue-on-error: true

        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          artifact_ids="$({
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '
                .artifacts[]
                | select(
                    (.name | startswith("blob-")) or
                    (.name | startswith("business-")) or
                    (.name | startswith("ai-audit-"))
                  )
                | .id
              '
          } || true)"

          if [[ -z "${artifact_ids}" ]]; then
            echo "No intermediate artifacts to remove."
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [[ -z "${artifact_id}" ]] && continue

            echo "Removing intermediate artifact ${artifact_id}"

            gh api \
              --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"

          done <<< "${artifact_ids}"
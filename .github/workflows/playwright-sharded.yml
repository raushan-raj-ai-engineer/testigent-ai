name: TestigentAI Multi-Project CI

on:
  workflow_dispatch:
    inputs:
      app:
        description: Project folder under projects/
        required: true
        default: demo

      environment:
        description: Project environment config
        required: true
        default: qa

      run_ai:
        description: Run configured AI provider healing validation
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: testigent-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: ${{ inputs.app || vars.APP || 'demo' }}
  ENV: ${{ inputs.environment || vars.ENV || 'qa' }}


jobs:

  # ========================================================
  # 1. CORE FRAMEWORK VALIDATION
  # ========================================================
  #
  # AI is deliberately disabled here.
  # Framework health should never depend on an external LLM.
  #
  validate:
    name: Framework Validation
    runs-on: ubuntu-latest

    env:
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate TestigentAI
        run: npm run validate:final


  # ========================================================
  # 2. NORMAL PROJECT REGRESSION
  # ========================================================
  #
  # No cloud AI secrets are exposed to this job.
  #
  test:
    name: Project Tests - Shard ${{ matrix.index }}
    needs: validate
    runs-on: ubuntu-latest

    env:
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'
      CI: 'true'
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - shard: '1/2'
            index: 1

          - shard: '2/2'
            index: 2

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run selected project shard
        run: >
          npm run test:project --
          --project=chromium
          --shard=${{ matrix.shard }}

      - name: Upload technical blob
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ env.APP }}-${{ matrix.index }}
          path: reports/${{ env.APP }}/blob-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload business shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: business-${{ env.APP }}-${{ matrix.index }}
          path: reports/${{ env.APP }}/business
          if-no-files-found: warn
          retention-days: 7


  # ========================================================
  # 3. AI PROVIDER / HEALING VALIDATION
  # ========================================================
  #
  # Runs:
  #
  #  - manually when Run AI = true
  #
  # OR
  #
  #  - automatically when repository variable:
  #
  #       AI_CI_ENABLED=true
  #
  # Pull requests intentionally do not receive AI secrets.
  #
  ai-smoke:
    name: AI Healing Validation

    needs: validate

    if: >-
      ${{
        github.event_name != 'pull_request' &&
        (
          inputs.run_ai == true ||
          vars.AI_CI_ENABLED == 'true'
        )
      }}

    runs-on: ubuntu-latest

    env:
      APP: demo
      ENV: qa

      AI_ENABLED: 'true'

      AI_PROVIDER_MODE: ${{ vars.AI_PROVIDER_MODE || 'single' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || '' }}
      AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || '' }}

      AI_ALLOW_CLOUD_EGRESS: ${{ vars.AI_ALLOW_CLOUD_EGRESS || 'false' }}

      HEALING_AI_ENABLED: 'true'
      HEALING_MODE: runtime

      AI_AUDIT_ENABLED: 'true'
      AI_RUNTIME_LOGGING: 'true'

      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || '' }}

      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || '' }}

      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT || '' }}
      AZURE_OPENAI_MODEL: ${{ vars.AZURE_OPENAI_MODEL || '' }}

      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || '' }}

      AI_COMPAT_BASE_URL: ${{ vars.AI_COMPAT_BASE_URL || '' }}
      AI_COMPAT_MODEL: ${{ vars.AI_COMPAT_MODEL || '' }}

      AI_ENDPOINT: ${{ vars.AI_ENDPOINT || '' }}
      AI_MODEL: ${{ vars.AI_MODEL || '' }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check configured AI provider
        run: npm run ai:check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_COMPAT_API_KEY: ${{ secrets.AI_COMPAT_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Run AI healing test
        run: npm run test:ai-healing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_COMPAT_API_KEY: ${{ secrets.AI_COMPAT_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Upload AI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-healing-${{ github.run_id }}
          path: |
            reports/demo/ai
            reports/demo/business
          if-no-files-found: warn
          retention-days: 7


  # ========================================================
  # 4. MERGE SHARDED TEST REPORTS
  # ========================================================

  merge:
    name: Merge Reports

    needs:
      - test

    if: ${{ always() && !cancelled() }}

    runs-on: ubuntu-latest

    env:
      AI_ENABLED: 'false'

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download technical blobs
        uses: actions/download-artifact@v8
        with:
          pattern: blob-${{ env.APP }}-*
          path: all-blob-reports
          merge-multiple: true

      - name: Download business shards
        uses: actions/download-artifact@v8
        with:
          pattern: business-${{ env.APP }}-*
          path: all-business-reports

      - name: Merge Playwright reports
        run: npm run report:merge:technical

      - name: Merge business reports
        run: npm run report:merge:business -- all-business-reports
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Finalize business report
        run: npm run ci:business:finalize

      - name: Generate business dashboard
        run: npm run report:business

      - name: Validate business bundle
        run: npm run ci:business:validate

      - name: Upload final TestigentAI reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ env.APP }}-${{ github.run_id }}
          path: reports/${{ env.APP }}
          if-no-files-found: error
          retention-days: 14

      - name: Optional stakeholder email
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            vars.BUSINESS_EMAIL_ENABLED == 'true'
          }}

        run: npm run ci:mail

        env:
          BUSINESS_EMAIL_ENABLED: 'true'

          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
name: TestigentAI Release Compatibility

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: ubuntu-latest
            browser: webkit
          - os: macos-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      APP: demo
      ENV: qa
      PW_BROWSERS: ${{ matrix.browser }}
      AI_ENABLED: 'false'
      HEALING_AI_ENABLED: 'false'
      EVIDENCE_VISUAL_POLICY: 'masked'
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install browser
        if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.browser }}

      - name: Static and type validation
        run: npm run release:static && npm run typecheck

      - name: Agentic deterministic safety
        run: npm run test:agentic:deterministic

      - name: Product intelligence deterministic safety
        run: npm run test:product-intelligence

      - name: Failure intelligence and showcase deterministic safety
        run: npm run test:failure-intelligence

      - name: Architect-review and recovery regression
        run: npx playwright test tests/framework/review-hardening-contract.spec.ts tests/framework/browser-free-fixtures.spec.ts tests/framework/healing-generation-contract.spec.ts --project=${{ matrix.browser }}

      - name: Capture exact runtime/browser versions
        env:
          COMPAT_BROWSER: ${{ matrix.browser }}
        run: node scripts/release-compatibility-probe.mjs

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            reports/release-compatibility
            reports/demo/qa
            test-results/demo/qa
          if-no-files-found: warn
          retention-days: 30
